{% extends "base.html" %}
{% block title %}Messages - SocialHub{% endblock %}
{% block page_class %}chat{% endblock %}
{% block content %}
<section class="chat-page"><div class="chat-layout"><aside class="chat-sidebar"><div class="chat-sidebar-header"><h1>Messages</h1><button class="btn-ghost" type="button" title="Refresh" onclick="loadChats()"><i class="fas fa-rotate"></i></button></div><label class="sr-only" for="chat-search-input">Search conversations</label><input id="chat-search-input" class="form-control" type="search" placeholder="Search people or chats" oninput="handleChatSearch(this.value)"><div id="chat-user-results" class="chat-user-results"></div><div id="chat-list" class="chat-list"><div class="loading"><div class="spinner"></div></div></div></aside><section class="chat-main"><header id="chat-main-header" class="chat-main-header hidden"></header><div id="messages-container" class="messages-container"><div class="empty-state chat-empty"><i class="fas fa-comments fa-3x"></i><h2>Select a conversation</h2><p>Choose an existing chat or search for a person to start messaging.</p></div></div><div class="message-bar" id="message-bar"><label class="sr-only" for="message-input">Message</label><input type="text" id="message-input" autocomplete="off" placeholder="Type a message…" onkeypress="if(event.key==='Enter')sendMessage(currentChatId)"><button class="send-btn" id="chat-send-btn" type="button" onclick="sendMessage(currentChatId)" title="Send"><i class="fas fa-paper-plane"></i></button></div></section></div></section>
{% endblock %}
