{% extends "auth_base.html" %}
{% block title %}Forgot Password - SocialHub{% endblock %}
{% block page_name %}forgot-password{% endblock %}
{% block content %}
<form id="forgot-password-form" class="auth-card stack" novalidate>
  <h1>Reset your password</h1>
  <p>Enter your email and we will send a 6-digit OTP code to reset your password.</p>
  <div id="error" class="form-error hidden" role="alert" aria-live="assertive"></div>
  <div id="success" class="form-success hidden" role="alert"></div>
  
  <label for="email">Email</label>
  <input id="email" class="form-control" type="email" autocomplete="email" required>
  
  <button class="btn btn-primary btn-block" type="submit" id="send-otp-btn">
    <span class="btn-text">Send OTP</span>
    <span class="btn-loader hidden"><i class="fas fa-spinner fa-spin"></i> Sending...</span>
  </button>
  
  <div class="auth-links"><a href="/login">Back to login</a></div>
</form>

<script>
(function() {
  const form = document.getElementById('forgot-password-form');
  const errorDiv = document.getElementById('error');
  const successDiv = document.getElementById('success');
  const sendBtn = document.getElementById('send-otp-btn');
  const emailInput = document.getElementById('email');

  function setLoading(loading) {
    const btnText = sendBtn.querySelector('.btn-text');
    const btnLoader = sendBtn.querySelector('.btn-loader');
    if (loading) {
      btnText.classList.add('hidden');
      btnLoader.classList.remove('hidden');
      sendBtn.disabled = true;
    } else {
      btnText.classList.remove('hidden');
      btnLoader.classList.add('hidden');
      sendBtn.disabled = false;
    }
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');

    const email = emailInput.value.trim();
    if (!email) {
      errorDiv.textContent = 'Please enter your email address.';
      errorDiv.classList.remove('hidden');
      return;
    }

    setLoading(true);
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      
      if (res.ok) {
        successDiv.textContent = data.message || 'If an account exists for this email, a password reset OTP has been sent.';
        successDiv.classList.remove('hidden');
        // Redirect to reset password page after short delay
        setTimeout(() => {
          window.location.href = '/reset-password';
        }, 2000);
      } else {
        errorDiv.textContent = data.detail || 'An error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
      }
    } catch (e) {
      errorDiv.textContent = 'Network error. Please check your connection.';
      errorDiv.classList.remove('hidden');
    } finally {
      setLoading(false);
    }
  });
})();
</script>
{% endblock %}
