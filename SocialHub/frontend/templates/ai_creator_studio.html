{% extends "base.html" %}
{% block title %}AI Creator Studio - SocialHub{% endblock %}
{% block page_class %}ai-creator-studio{% endblock %}
{% block content %}
<section class="content-stack"><div class="page-header"><div><h1>AI Creator Studio</h1><p>Generate captions, hashtags, bios, ideas and image prompts.</p></div></div><div class="dashboard-grid"><section class="surface-card stack"><h2>Text tools</h2><input id="ai-topic" class="form-control" placeholder="Topic or niche"><select id="ai-tool" class="form-control"><option value="caption">Caption</option><option value="hashtags">Hashtags</option><option value="viral-hooks">Viral hooks</option><option value="post-ideas">Post ideas</option><option value="content-calendar">Content calendar</option><option value="bio">Bio</option><option value="comment-reply">Comment reply</option></select><button class="btn btn-primary" onclick="runCreatorAI()">Generate</button><div id="ai-output" class="ai-output-cards"></div></section><section class="surface-card stack"><h2>Image prompt editor</h2><input id="image-prompt-file" class="form-control" type="file" accept="image/*" onchange="previewImagePromptFile()"><textarea id="image-prompt-text" class="form-control" rows="3" placeholder="Describe the edit"></textarea><select id="image-prompt-style" class="form-control"><option value="natural">Natural</option><option value="studio">Studio</option><option value="cinematic">Cinematic</option></select><div id="image-prompt-preview" class="upload-preview"></div><button class="btn btn-primary" onclick="runImagePromptEditor()">Read image & improve prompt</button><div id="image-prompt-output"></div></section></div></section>
{% endblock %}
