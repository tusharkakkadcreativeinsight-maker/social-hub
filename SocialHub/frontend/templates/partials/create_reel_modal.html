<div class="modal-overlay create-modal" id="create-reel-modal" onclick="if(event.target===this)closeModal('create-reel-modal')"><div class="modal modal-wide" role="dialog" aria-modal="true"><div class="modal-header"><h2><i class="fas fa-clapperboard"></i> Upload reel</h2><button class="modal-close" type="button" onclick="closeModal('create-reel-modal')">&times;</button></div><form id="reel-upload-form" onsubmit="handleCreateReel(event)" class="form-grid"><div class="stack"><label for="reel-file">Video</label><input id="reel-file" class="form-control" type="file" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov" required><label for="reel-thumbnail">Cover</label><input id="reel-thumbnail" class="form-control" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.png,.webp"><div id="reel-preview" class="upload-preview"></div></div><div class="stack"><label for="reel-title">Title</label><input id="reel-title" class="form-control" maxlength="120"><label for="reel-caption">Caption</label><textarea id="reel-caption" class="form-control" rows="4" maxlength="2200"></textarea><label for="reel-hashtags">Hashtags</label><input id="reel-hashtags" class="form-control" placeholder="creator, socialhub"><label for="reel-location">Location</label><input id="reel-location" class="form-control"><input type="hidden" id="selected-music-id"><div class="music-picker-inline"><span id="selected-music-label">No music selected</span><button class="btn btn-outline btn-sm" type="button" onclick="loadMusicLibrary()">Pick music</button></div><select id="reel-visibility" class="form-control"><option value="public">Public</option><option value="followers">Followers</option><option value="private">Private</option></select><div id="music-picker" class="music-picker hidden"><input class="form-control" type="search" placeholder="Search music" oninput="searchMusic(this.value)"><div id="music-list" class="mini-list"></div></div><div id="reel-upload-progress" class="upload-progress hidden"><div id="reel-upload-progress-fill"></div><span id="reel-upload-progress-text"></span></div><button type="submit" class="btn btn-primary btn-block"><i class="fas fa-cloud-upload-alt"></i> Upload Reel</button></div></form></div></div>
