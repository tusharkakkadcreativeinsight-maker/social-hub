<div class="modal-overlay create-modal" id="create-story-modal" onclick="if(event.target===this)closeModal('create-story-modal')"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><h2><i class="fas fa-circle-plus"></i> Add story</h2><button class="modal-close" type="button" onclick="closeModal('create-story-modal')">&times;</button></div><form onsubmit="handleCreateStory(event)" class="stack"><label for="story-caption">Caption</label><textarea id="story-caption" class="form-control" rows="3" maxlength="500" placeholder="Share a moment…"></textarea><label class="upload-dropzone" for="story-file"><i class="fas fa-images"></i><span>Select story media</span><small>Visible for 24 hours · max 100MB</small><input type="file" id="story-file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime,video/x-msvideo,.jpg,.jpeg,.png,.gif,.webp,.mp4,.webm,.mov,.avi" required></label><div id="story-preview" class="upload-preview"></div><div id="story-upload-progress" class="upload-progress hidden"><div id="story-upload-progress-fill"></div><span id="story-upload-progress-text"></span></div><button type="submit" class="btn btn-primary btn-block"><i class="fas fa-cloud-upload-alt"></i> Share story</button></form></div></div><div class="story-viewer" id="story-viewer" onclick="if(event.target===this)this.classList.remove('active')"></div>
