<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-users"></i> SocialHub<span>Pro</span></h1>
                <h2>Welcome back</h2>
                <p>Login to your account to continue</p>
            </div>
            <div class="error hidden" id="error"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="padding:12px;font-size:15px">Login</button>
            </form>
            <div class="auth-footer">
                <p><a href="/forgot-password">Forgot password?</a></p>
                <p style="margin-top:12px">Don't have an account? <a href="/register">Register</a></p>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
