<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-heart"></i> SocialHub</a>
        <div class="nav-search"><i class="fas fa-search"></i><input type="text" id="global-search" placeholder="Search creators, posts, #tags..." onkeypress="if(event.key==='Enter')window.location.href='/search?q='+this.value"></div>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h2><i class="fas fa-film" style="color:var(--primary);margin-right:10px"></i>Reels</h2>
            <button id="uploadReelBtn" class="btn btn-primary upload-reel-btn" type="button"><i class="fas fa-upload"></i> Upload Reel</button>
        </div>
        <div class="reels-container reels-fullscreen" id="reels-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <div class="modal-overlay" id="create-reel-modal" data-close-modal="create-reel-modal">
        <div class="modal reel-upload-modal" role="dialog" aria-modal="true" aria-labelledby="reel-upload-title">
            <div class="modal-header"><h3 id="reel-upload-title"><i class="fas fa-clapperboard"></i> Upload Reel</h3><button class="modal-close" type="button" data-close-modal="create-reel-modal">&times;</button></div>
            <form id="reel-upload-form">
                <label for="reel-caption" class="form-label">Caption</label>
                <textarea id="reel-caption" class="form-control" rows="3" placeholder="Write a caption..."></textarea>
                <label for="reel-title" class="form-label">Audio / title <span class="optional">optional</span></label>
                <input id="reel-title" class="form-control" type="text" maxlength="150" placeholder="Original audio, song name, or reel title">
                <input id="selected-music-id" type="hidden">
                <div class="music-picker-card">
                    <div><strong>Music</strong><p id="selected-music-label">No music selected</p></div>
                    <button class="btn btn-outline btn-sm" type="button" onclick="loadMusicLibrary()"><i class="fas fa-music"></i> Pick Music</button>
                </div>
                <div class="music-upload-inline">
                    <input id="music-upload-title" class="form-control" type="text" maxlength="150" placeholder="Upload song title">
                    <input id="music-upload-artist" class="form-control" type="text" maxlength="150" placeholder="Artist">
                    <input id="music-upload-category" class="form-control" type="text" maxlength="80" placeholder="Category">
                    <input id="music-upload-file" class="form-control" type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/mp4,.mp3,.wav,.m4a,.ogg">
                    <button class="btn btn-outline btn-sm" type="button" onclick="uploadMusic()"><i class="fas fa-cloud-upload-alt"></i> Upload Music</button>
                </div>
                <div id="music-picker" class="music-picker hidden">
                    <input id="music-search" class="form-control" type="search" placeholder="Search music..." oninput="searchMusic(this.value)">
                    <div id="music-list" class="music-list"></div>
                </div>
                <label for="reel-hashtags" class="form-label">Hashtags <span class="optional">optional</span></label>
                <input id="reel-hashtags" class="form-control" type="text" placeholder="hashtags, comma, separated">
                <label for="reel-location" class="form-label">Location <span class="optional">optional</span></label>
                <input id="reel-location" class="form-control" type="text" placeholder="Add location">
                <label for="reel-visibility" class="form-label">Visibility</label>
                <select id="reel-visibility" class="form-control"><option value="public">Public</option><option value="private">Private</option></select>
                <div class="form-row"><input id="reel-trim-start" class="form-control" type="number" min="0" step="0.1" placeholder="Trim start"><input id="reel-trim-end" class="form-control" type="number" min="0" step="0.1" placeholder="Trim end"></div>
                <input id="reel-text-overlay" class="form-control" type="text" maxlength="255" placeholder="Text overlay">
                <input id="reel-filter-name" class="form-control" type="text" maxlength="100" placeholder="Filter name">
                <label class="upload-dropzone" for="reel-thumbnail"><i class="fas fa-image"></i><span>Select cover image</span><small>Optional JPG, PNG, WEBP</small><input id="reel-thumbnail" name="thumbnail" type="file" accept="image/*"></label>
                <label class="upload-dropzone" for="reel-file"><i class="fas fa-video"></i><span>Select reel video</span><small>MP4, MOV or WEBM · max 100MB</small><input id="reel-file" name="file" type="file" accept="video/*,.mp4,.webm,.mov" required></label>
                <div id="reel-preview" class="upload-preview"></div>
                <div id="reel-upload-progress" class="upload-progress hidden"><div id="reel-upload-progress-fill"></div><span id="reel-upload-progress-text"></span></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" data-close-modal="create-reel-modal">Cancel</button>
                    <button id="submitReelUploadBtn" type="submit" class="btn btn-primary"><i class="fas fa-cloud-upload-alt"></i> Upload Reel</button>
                </div>
            </form>
        </div>
    </div>
    <div class="modal-overlay" id="comments-modal" onclick="if(event.target===this)this.classList.remove('active')"><div class="modal"><div class="modal-header"><h3>Comments</h3><button class="modal-close" onclick="document.getElementById('comments-modal').classList.remove('active')">&times;</button></div><div id="comments-content"></div></div></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
