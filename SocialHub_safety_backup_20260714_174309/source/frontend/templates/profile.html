<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-heart"></i> SocialHub</a>
        <div class="nav-search"><i class="fas fa-search"></i><input type="text" id="global-search" placeholder="Search creators, posts, #tags..." onkeypress="if(event.key==='Enter')window.location.href='/search?q='+this.value"></div>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container">
        <div class="profile-wrapper">
            <div id="profile-content">
                <!-- Skeleton Loading -->
                <div class="profile-skeleton">
                    <div class="profile-skeleton-cover"></div>
                    <div class="profile-skeleton-body">
                        <div class="profile-skeleton-avatar"></div>
                        <div class="profile-skeleton-line short" style="margin-top:16px;"></div>
                        <div class="profile-skeleton-line medium"></div>
                        <div class="profile-skeleton-line long"></div>
                        <div class="profile-skeleton-stats">
                            <div class="profile-skeleton-stat"></div>
                            <div class="profile-skeleton-stat"></div>
                            <div class="profile-skeleton-stat"></div>
                            <div class="profile-skeleton-stat"></div>
                        </div>
                    </div>
                    <div class="profile-skeleton-tabs">
                        <div class="profile-skeleton-tab"></div>
                        <div class="profile-skeleton-tab"></div>
                        <div class="profile-skeleton-tab"></div>
                        <div class="profile-skeleton-tab"></div>
                    </div>
                </div>
            </div>
            <div id="profile-tab-content"></div>
        </div>
    </div>
    <div class="modal-overlay" id="comments-modal" onclick="if(event.target===this)this.classList.remove('active')"><div class="modal"><div class="modal-header"><h3>Comments</h3><button class="modal-close" onclick="document.getElementById('comments-modal').classList.remove('active')">&times;</button></div><div id="comments-content"></div></div></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
