<div class="modal-overlay" id="create-post-modal" data-modal aria-hidden="true"><section class="modal large" role="dialog" aria-modal="true" aria-labelledby="create-post-title"><button class="modal-close" data-action="close-modal" data-target="create-post-modal" aria-label="Close">×</button><h2 id="create-post-title">Create post</h2><form id="create-post-form" data-action="create-post-form"><div class="composer-grid"><label class="upload-dropzone" for="post-files"><i class="fas fa-cloud-arrow-up"></i><strong>Upload media</strong><span>Images or video up to platform limit</span><input id="post-files" name="files" type="file" multiple accept="image/*,video/*" hidden></label><div><label for="post-content">Caption</label><textarea id="post-content" name="content" class="form-control" rows="7" placeholder="Write a caption, add #hashtags and @mentions..."></textarea><div class="form-row"><label><span>Location</span><input class="form-control" id="post-location" name="location" placeholder="Optional"></label><label><span>Privacy</span><select class="form-control" id="post-privacy" name="privacy"><option value="public">Public</option><option value="followers">Followers</option><option value="private">Only me</option></select></label></div></div></div><div id="post-preview" class="upload-preview-grid"></div><div class="upload-progress hidden" id="post-upload-progress"><span id="post-upload-progress-fill"></span><em id="post-upload-progress-text">Uploading 0%</em></div><div class="modal-actions"><button class="btn btn-secondary" type="reset">Clear</button><button class="btn btn-primary" id="post-submit" type="submit">Publish</button></div></form></section></div>
