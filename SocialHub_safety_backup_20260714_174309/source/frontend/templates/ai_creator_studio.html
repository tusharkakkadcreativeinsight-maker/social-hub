<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Creator Studio - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="ai-creator-studio">
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-heart"></i> SocialHub</a>
        <div class="nav-search"><i class="fas fa-search"></i><input placeholder="Search creators, posts, #tags..." onkeypress="if(event.key==='Enter')window.location.href='/search?q='+encodeURIComponent(this.value)"></div>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <main class="container">
        <div class="grid">
            <aside class="sidebar-left">
                <a href="#" class="create-post-sidebar-btn" onclick="showCreatePost()"><i class="fas fa-plus"></i>Create</a>
                <nav class="menu-list socialhub-auto-menu"></nav>
                <div class="sidebar-user-card socialhub-user-mini"><img src="/static/images/default_avatar.svg"><div class="sidebar-user-meta"><div class="name">SocialHub</div><div class="handle">@creator</div></div></div>
            </aside>
            <section>
                <div class="page-header"><h2><i class="fas fa-wand-magic-sparkles"></i> AI Creator Studio</h2></div>

                <div class="creator-tool-card">
                    <div class="form-group"><label>Topic or prompt</label><input id="ai-topic" class="form-control" placeholder="fitness tips, fashion reels, small business growth"></div>
                    <div class="form-group"><label>Tool</label><select id="ai-tool" class="form-control"><option value="caption">Caption</option><option value="hashtags">Hashtags</option><option value="viral-hooks">Viral hooks</option><option value="post-ideas">Post ideas</option><option value="content-calendar">Content calendar</option><option value="bio">Bio</option><option value="comment-reply">Comment reply</option></select></div>
                    <button class="btn btn-primary" onclick="runCreatorAI()">Generate</button>
                </div>

                <div id="ai-output" class="ai-output"></div>

                <div class="creator-tool-card" style="margin-top:18px">
                    <div class="page-header" style="margin-bottom:12px"><h3><i class="fas fa-image"></i> Image Prompt Editor</h3></div>
                    <p class="text-muted">Upload an image, describe the change you want, and the backend will read the image metadata and return a stronger AI edit prompt.</p>
                    <div class="form-group">
                        <label>Upload image</label>
                        <input id="image-prompt-file" type="file" class="form-control" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" onchange="previewImagePromptFile()">
                    </div>
                    <div id="image-prompt-preview" class="upload-preview"></div>
                    <div class="form-group">
                        <label>Change prompt</label>
                        <textarea id="image-prompt-text" class="form-control" rows="4" placeholder="Example: make the background sunset, add cinematic lighting, keep the person realistic"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Style</label>
                        <select id="image-prompt-style" class="form-control">
                            <option value="natural">Natural</option>
                            <option value="cinematic">Cinematic</option>
                            <option value="fashion editorial">Fashion editorial</option>
                            <option value="product ad">Product ad</option>
                            <option value="vibrant social post">Vibrant social post</option>
                            <option value="minimal clean">Minimal clean</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="runImagePromptEditor()"><i class="fas fa-magic"></i> Read Image & Improve Prompt</button>
                </div>

                <div id="image-prompt-output" class="ai-output"></div>
            </section>
        </div>
    </main>
    <script src="/static/js/app.js"></script>
    <script>document.addEventListener('DOMContentLoaded',()=>{renderSocialHubMenu('ai-creator-studio');hydrateMiniUser();});</script>
</body>
</html>
