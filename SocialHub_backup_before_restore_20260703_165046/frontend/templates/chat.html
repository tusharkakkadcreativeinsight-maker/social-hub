<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container fade-in">
        <div class="chat-layout slide-up">
            <div class="chat-sidebar">
                <div class="chat-sidebar-header">
                    <h3>Messages</h3>
                    <button class="btn btn-icon btn-ghost" title="New message" onclick="startNewChat()">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button class="btn btn-icon btn-ghost" title="New group" onclick="createGroupChat()">
                        <i class="fas fa-users"></i>
                    </button>
                    <button class="btn btn-icon btn-ghost" title="AI chat" onclick="openAIChat()">
                        <i class="fas fa-robot"></i>
                    </button>
                </div>
                <div class="chat-search">
                    <input type="text" placeholder="Search messages..." oninput="filterChats(this.value)">
                </div>
                <div class="chat-list" id="chat-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            <div class="chat-main">
                <div class="chat-main-header" id="chat-header">
                    <div style="flex:1;text-align:center;color:var(--text-secondary);font-size:14px">
                        <i class="fas fa-comments" style="font-size:48px;margin-bottom:16px;display:block;color:var(--border)"></i>
                        <h3 style="color:var(--text);margin-bottom:8px;font-weight:700">Your Messages</h3>
                        <p style="font-size:14px">Send private photos and messages</p>
                    </div>
                </div>
                <div id="messages-container" style="display:flex;align-items:center;justify-content:center;flex:1">
                    <div style="text-align:center;color:var(--text-secondary);padding:40px">
                    </div>
                </div>
                <div class="message-input-bar" id="chat-input-bar" style="display:none">
                    <button class="attach-btn" title="Add emoji" onclick="insertEmoji()">
                        <i class="far fa-smile"></i>
                    </button>
                    <button class="attach-btn" title="Voice or file" onclick="document.getElementById('chat-file-input').click()">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <input type="file" id="chat-file-input" accept="image/*,video/*,audio/*" style="display:none" onchange="sendChatFile(currentChatId,this)">
                    <input type="text" id="message-input" placeholder="Type a message..." 
                           onkeypress="if(event.key==='Enter')sendMessage(currentChatId)">
                    <button class="send-btn" onclick="sendMessage(currentChatId)" title="Send message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
