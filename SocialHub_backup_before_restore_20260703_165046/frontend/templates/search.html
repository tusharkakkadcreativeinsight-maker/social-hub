<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container search-page fade-in">
        <div class="search-bar slide-up">
            <input type="text" id="search-input" placeholder="Search users, posts, tags..." 
                   onkeypress="if(event.key==='Enter')handleSearch(event)">
            <button class="btn btn-primary" onclick="handleSearch(event)">
                <i class="fas fa-search"></i>
            </button>
        </div>
        <div class="search-tabs slide-up" style="animation-delay: 0.05s">
            <button class="search-tab active" onclick="switchSearchTab(this,'top')">
                <i class="fas fa-fire"></i> Trending
            </button>
            <button class="search-tab" onclick="switchSearchTab(this,'users')">
                <i class="fas fa-users"></i> Users
            </button>
            <button class="search-tab" onclick="switchSearchTab(this,'tags')">
                <i class="fas fa-hashtag"></i> Tags
            </button>
            <button class="search-tab" onclick="switchSearchTab(this,'places')">
                <i class="fas fa-map-marker-alt"></i> Places
            </button>
        </div>
        <div id="search-results" class="slide-up" style="animation-delay: 0.1s">
            <div class="empty-state">
                <i class="fas fa-search" style="font-size:48px"></i>
                <h3>Discover</h3>
                <p>Search for people, tags, and places</p>
            </div>
        </div>
        <div id="explore-grid" class="explore-grid" style="margin-top:24px"></div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
