<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body class="auth-page">
    <!-- Floating background icons -->
    <div class="auth-bg-icons">
        <i class="fab fa-instagram"></i>
        <i class="fab fa-facebook"></i>
        <i class="fab fa-twitter"></i>
        <i class="fas fa-camera"></i>
        <i class="fas fa-heart"></i>
        <i class="fas fa-comment"></i>
        <i class="fas fa-share-alt"></i>
    </div>

    <div class="auth-container">
        <!-- Login Card -->
        <div class="auth-card slide-up">
            <div class="auth-header">
                <h1><i class="fas fa-camera-retro"></i> Social<span>Hub</span></h1>
                <h2>Welcome</h2>
                <p>Sign in to see what's happening</p>
            </div>

            <!-- Error Message -->
            <div class="error hidden" id="error"></div>
            <div class="success-msg hidden" id="success"></div>

            <form id="login-form">
                <div class="form-group input-focus-effect">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log In</button>
            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <button class="auth-social-btn" type="button" onclick="toast('Facebook login is not enabled in this local demo. Use email/password.', 'info')">
                <i class="fab fa-facebook-square" style="font-size:20px"></i>
                Log in with Facebook
            </button>

            <div class="auth-footer">
                <p><a href="/forgot-password">Forgot password?</a></p>
            </div>
        </div>

        <!-- Sign Up Card -->
        <div class="auth-switch">
            <p>Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
