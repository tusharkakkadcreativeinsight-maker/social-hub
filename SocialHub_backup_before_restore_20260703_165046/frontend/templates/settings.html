<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container fade-in">
        <div class="settings-layout slide-up">
            <div class="settings-sidebar">
                <a href="#" class="active" onclick="toast('Edit profile is open', 'info');return false;"><i class="fas fa-user"></i> Edit Profile</a>
                <a href="#" onclick="changePasswordPrompt();return false;"><i class="fas fa-lock"></i> Change Password</a>
                <a href="#" onclick="loadNotificationSettingsPrompt();return false;"><i class="fas fa-bell"></i> Notifications</a>
                <a href="#" onclick="showPrivacyInfo();return false;"><i class="fas fa-shield-alt"></i> Privacy</a>
                <a href="#" onclick="toggleTheme();return false;"><i class="fas fa-palette"></i> Theme</a>
            </div>
            <div class="settings-content">
                <h2 style="font-size:22px;font-weight:800;margin-bottom:24px">Edit Profile</h2>
                <form onsubmit="handleUpdateProfile(event)">
                    <div class="form-group">
                        <label>Profile Picture</label>
                        <div style="display:flex;align-items:center;gap:20px">
                            <img id="settings-avatar" src="/static/images/default-avatar.png" class="avatar-lg" alt="">
                            <div>
                                <input type="file" id="profile-pic-input" accept="image/*" onchange="uploadProfilePic(event)" 
                                       style="font-size:13px;color:var(--text-secondary)">
                                <p style="font-size:11px;color:var(--text-muted);margin-top:4px">JPG, PNG. Max 5MB.</p>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Cover Photo</label>
                        <div style="display:flex;align-items:center;gap:20px">
                            <img id="settings-cover" src="/static/images/default-avatar.png" style="width:160px;height:70px;object-fit:cover;border-radius:12px;border:1px solid var(--border)" alt="Cover">
                            <div>
                                <input type="file" id="cover-photo-input" accept="image/*" onchange="uploadCoverPhoto(event)"
                                       style="font-size:13px;color:var(--text-secondary)">
                                <p style="font-size:11px;color:var(--text-muted);margin-top:4px">JPG, PNG. Max 10MB.</p>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="settings-fullname" placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="settings-bio" class="form-control" rows="3" placeholder="Tell us about yourself" maxlength="150"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="settings-email" placeholder="Email" readonly style="opacity:0.6">
                    </div>
                    <button type="submit" class="btn btn-primary" style="padding:10px 28px;font-weight:700">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
