<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub - Forgot Password</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>SocialHub</h1>
                <p>Reset your password</p>
            </div>
            <form id="forgot-form" onsubmit="event.preventDefault();forgotPassword()">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
                <div class="auth-footer">
                    <a href="/login">Back to Login</a>
                </div>
            </form>
            <div id="forgot-message" class="hidden"></div>
        </div>
    </div>
    <script>
        async function forgotPassword() {
            const email = document.getElementById('email').value;
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                document.getElementById('forgot-form').innerHTML = `<p style="color:var(--success);text-align:center;">${data.message}</p>`;
            } catch (error) {
                showAlert('Failed to send reset email', 'danger');
            }
        }
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
