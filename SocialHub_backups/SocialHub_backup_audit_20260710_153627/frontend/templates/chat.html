<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-heart"></i> SocialHub</a>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container">
        <div class="chat-layout">
            <div class="chat-sidebar" id="chat-sidebar">
                <div class="chat-sidebar-header">
                    <div>
                        <h3>Messages</h3>
                        <span class="chat-subtitle">Real-time private chats</span>
                    </div>
                    <button class="btn-ghost" style="font-size:18px;padding:8px" title="Refresh" onclick="loadChats()"><i class="fas fa-rotate"></i></button>
                </div>
                <div class="chat-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="chat-search-input" placeholder="Search users or chats..." oninput="handleChatSearch(this.value)">
                </div>
                <div class="chat-search-results" id="chat-user-results"></div>
                <div class="chat-list" id="chat-list"><div class="loading"><div class="spinner"></div></div></div>
            </div>
            <div class="chat-main" id="chat-main">
                <div class="chat-main-header hidden" id="chat-main-header"></div>
                <div id="messages-container">
                    <div class="empty-state">
                        <i class="fas fa-comments fa-3x"></i>
                        <h3>Your Messages</h3>
                        <p>Send private messages to a friend or group</p>
                    </div>
                </div>
                <div class="message-input-bar" id="message-bar" style="display:none">
                    <button class="attach-btn" title="Attach file"><i class="fas fa-plus-circle"></i></button>
                    <input type="text" id="message-input" autocomplete="off" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage(currentChatId)">
                    <button class="send-btn" id="chat-send-btn" onclick="sendMessage(currentChatId)" title="Send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script>
        currentChatId = window.location.pathname.split('/chat/')[1] || null;
        if (currentChatId) {
            document.getElementById('message-bar').style.display = 'flex';
            loadChatMessages(currentChatId);
        }
    </script>
</body>
</html>
