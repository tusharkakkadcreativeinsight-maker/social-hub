<div class="modal-overlay" id="create-post-modal" data-modal><section class="modal large"><button class="modal-close" data-action="close-modal" data-target="create-post-modal">×</button><h2>Create post</h2><form id="create-post-form"><div class="composer-grid"><label class="upload-dropzone" for="post-files"><i class="fas fa-cloud-arrow-up"></i><strong>Drag and drop media</strong><span>Images or video</span><input id="post-files" name="files" type="file" multiple accept="image/*,video/*" hidden></label><div><label for="post-content">Caption</label><textarea id="post-content" class="form-control" rows="7" placeholder="Write a caption, add #hashtags and @mentions..."></textarea><div class="form-row"><input class="form-control" id="post-location" placeholder="Location"><select class="form-control" id="post-privacy"><option>Public</option><option>Followers</option><option>Only me</option></select></div></div></div><div id="post-preview" class="upload-preview-grid"></div><div class="upload-progress hidden" id="post-upload-progress"><span id="post-upload-progress-fill"></span><em id="post-upload-progress-text">Uploading 0%</em></div><div class="modal-actions"><button class="btn btn-secondary" type="button">Save draft</button><button class="btn btn-primary" id="post-submit" type="submit" disabled>Publish</button></div></form></section></div>
