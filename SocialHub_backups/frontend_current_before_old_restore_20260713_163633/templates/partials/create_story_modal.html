<div class="modal-overlay" id="create-story-modal" data-modal><section class="modal"><button class="modal-close" data-action="close-modal" data-target="create-story-modal">×</button><h2>Create story</h2><form id="story-upload-form"><label class="upload-dropzone" for="story-file"><i class="fas fa-circle-plus"></i><strong>Select story media</strong><input id="story-file" type="file" accept="image/*,video/*" hidden required></label><textarea id="story-caption" class="form-control" rows="3" placeholder="Add a caption..."></textarea><div id="story-preview" class="upload-preview"></div><div class="modal-actions"><button class="btn btn-primary" id="story-submit" disabled>Share story</button></div></form></section></div>
