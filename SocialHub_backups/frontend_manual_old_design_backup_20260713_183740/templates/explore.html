<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="/" class="logo"><i class="fas fa-share-alt"></i> SocialHub</a>
                <button class="sidebar-close" onclick="toggleSidebar()">&times;</button>
            </div>
            <nav class="menu-list socialhub-auto-menu" id="sidebar-menu"></nav>
            <div class="sidebar-footer">
                <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i> Theme</button>
                <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </aside>
        <main class="main-content">
            <header class="top-bar">
                <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1>Explore</h1>
                <div class="top-bar-actions">
                    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
                </div>
            </header>
            <div class="content-container">
                <div class="explore-tabs">
                    <button class="explore-tab active" onclick="switchExploreTab('posts')"><i class="fas fa-th"></i> Posts</button>
                    <button class="explore-tab" onclick="switchExploreTab('reels')"><i class="fas fa-video"></i> Reels</button>
                    <button class="explore-tab" onclick="switchExploreTab('hashtags')"><i class="fas fa-hashtag"></i> Hashtags</button>
                    <button class="explore-tab" onclick="switchExploreTab('people')"><i class="fas fa-users"></i> People</button>
                </div>
                <div id="explore-content" class="explore-content">
                    <div class="loading"><div class="spinner"></div><span>Loading explore feed...</span></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Comments Modal -->
    <div class="modal" id="comments-modal">
        <div class="modal-backdrop" onclick="closeModal('comments-modal')"></div>
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3>Comments</h3>
                <button class="modal-close" onclick="closeModal('comments-modal')">&times;</button>
            </div>
            <div id="comments-content" class="modal-body"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="/static/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateNav();
            renderSocialHubMenu('search');
            hydrateMiniUser();
            loadExploreFeed();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function switchExploreTab(tab) {
            document.querySelectorAll('.explore-tab').forEach(t => t.classList.remove('active'));
            event.target.closest('.explore-tab').classList.add('active');
            loadExploreFeed(tab);
        }

        async function loadExploreFeed(tab = 'posts') {
            const container = document.getElementById('explore-content');
            if (!container) return;
            try {
                container.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading...</span></div>';
                const data = await api('/explore');
                
                if (tab === 'posts') renderExplorePosts(container, data.trending_posts || []);
                else if (tab === 'reels') renderExploreReels(container, data.trending_reels || []);
                else if (tab === 'hashtags') renderExploreHashtags(container, data.trending_hashtags || []);
                else if (tab === 'people') renderExplorePeople(container, data.suggested_users || []);
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-compass fa-3x"></i><h3>Error loading explore</h3><p>${escapeHtml(e.message)}</p></div>`;
            }
        }

        function renderExplorePosts(container, posts) {
            if (!posts.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-newspaper fa-3x"></i><h3>No trending posts</h3></div>';
                return;
            }
            container.innerHTML = `<div class="posts-grid">${posts.map(p => {
                const author = p.author || {};
                const imgHtml = (p.images || []).map(img => 
                    img.is_video 
                        ? `<video src="${mediaUrl(img.video_url)}" class="post-media" muted></video>`
                        : `<img src="${mediaUrl(img.image_url)}" class="post-media" loading="lazy">`
                ).join('');
                return `<div class="post-card">
                    <div class="post-header">
                        <a href="/profile/${author.username}" class="post-author">
                            <img src="${getProfilePic(author)}" class="avatar-sm" alt="">
                            <div><span class="username">${author.username || ''}</span>${author.is_verified ? '<i class="fas fa-check-circle verified"></i>' : ''}</div>
                        </a>
                    </div>
                    ${p.content ? `<div class="post-content"><p>${escapeHtml(p.content)}</p></div>` : ''}
                    ${imgHtml ? `<div class="post-images">${imgHtml}</div>` : ''}
                    <div class="post-actions">
                        <span><i class="fas fa-heart"></i> ${p.likes_count || 0}</span>
                        <span><i class="fas fa-comment"></i> ${p.comments_count || 0}</span>
                        <span><i class="fas fa-share"></i> ${p.shares_count || 0}</span>
                    </div>
                </div>`;
            }).join('')}</div>`;
        }

        function renderExploreReels(container, reels) {
            if (!reels.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-video fa-3x"></i><h3>No trending reels</h3></div>';
                return;
            }
            container.innerHTML = `<div class="reels-grid">${reels.map(r => {
                const author = r.author || {};
                const cover = r.cover_image || r.thumbnail_url;
                return `<div class="reel-card-sm" onclick="window.location.href='/reels'">
                    ${cover ? `<img src="${mediaUrl(cover)}" class="reel-thumb" loading="lazy">` : `<video src="${mediaUrl(r.video_url)}" muted loop preload="metadata" class="reel-thumb"></video>`}
                    <div class="reel-card-overlay">
                        <span><i class="fas fa-play"></i> ${r.views_count || 0}</span>
                        <span><i class="fas fa-heart"></i> ${r.likes_count || 0}</span>
                    </div>
                    <div class="reel-card-info">
                        <span class="username">@${author.username || ''}</span>
                    </div>
                </div>`;
            }).join('')}</div>`;
            // Autoplay on hover
            document.querySelectorAll('.reel-thumb').forEach(v => {
                v.addEventListener('mouseenter', () => v.play().catch(() => {}));
                v.addEventListener('mouseleave', () => v.pause());
            });
        }

        function renderExploreHashtags(container, hashtags) {
            if (!hashtags.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-hashtag fa-3x"></i><h3>No trending hashtags</h3></div>';
                return;
            }
            container.innerHTML = `<div class="hashtags-grid">${hashtags.map(h => `
                <div class="hashtag-card" onclick="searchHashtag('${h.tag}')">
                    <div class="hashtag-icon"><i class="fas fa-hashtag"></i></div>
                    <div class="hashtag-info">
                        <span class="hashtag-name">#${escapeHtml(h.tag)}</span>
                        <span class="hashtag-count">${h.count} posts</span>
                    </div>
                </div>
            `).join('')}</div>`;
        }

        function renderExplorePeople(container, users) {
            if (!users.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-users fa-3x"></i><h3>No suggestions yet</h3></div>';
                return;
            }
            container.innerHTML = `<div class="users-grid">${users.map(u => `
                <div class="user-card">
                    <a href="/profile/${u.username}">
                        <img src="${getProfilePic(u)}" class="avatar-lg" alt="">
                    </a>
                    <div class="user-card-info">
                        <a href="/profile/${u.username}" class="username">${escapeHtml(u.full_name || u.username)}</a>
                        <span>@${u.username}${u.is_verified ? ' <i class="fas fa-check-circle verified"></i>' : ''}</span>
                        <span class="followers-count">${u.followers_count} followers</span>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="followExploreUser('${u.id}')">Follow</button>
                </div>
            `).join('')}</div>`;
        }

        function searchHashtag(tag) {
            window.location.href = `/search?q=%23${encodeURIComponent(tag)}`;
        }

        async function followExploreUser(userId) {
            try {
                await api(`/follow/${userId}`, { method: 'POST' });
                showToast('Followed successfully', 'success');
                loadExploreFeed('people');
            } catch (e) {
                showToast(e.message || 'Could not follow user', 'error');
            }
        }
    </script>
</body>
</html>
