<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub - Reset Password</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>SocialHub</h1>
                <p>Set new password</p>
            </div>
            <form id="reset-form" onsubmit="event.preventDefault();resetPassword()">
                <input type="hidden" id="token" value="{{ token }}">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter new password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
                <div class="auth-footer">
                    <a href="/login">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        async function resetPassword() {
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                if (response.ok) {
                    document.getElementById('reset-form').innerHTML = '<p style="color:var(--success);text-align:center;">Password reset successfully! <a href="/login">Login</a></p>';
                } else {
                    const data = await response.json();
                    showAlert(data.detail || 'Reset failed', 'danger');
                }
            } catch (error) {
                showAlert('Failed to reset password', 'danger');
            }
        }
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
