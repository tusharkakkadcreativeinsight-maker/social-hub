{% extends "base.html" %}
{% block title %}Creator Wallet - SocialHub{% endblock %}
{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1>Creator Wallet</h1>
  </div>
  <div class="wallet-container">
    <div class="wallet-balance">
      <div class="balance-card">
        <h3>Total Balance</h3>
        <div class="balance-amount">$<span id="balance">0.00</span></div>
        <div class="balance-details">
          <div class="detail-item">
            <span>Total Earned</span>
            <span>$<span id="total-earned">0.00</span></span>
          </div>
          <div class="detail-item">
            <span>Total Withdrawn</span>
            <span>$<span id="total-withdrawn">0.00</span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="wallet-actions">
      <button class="btn-primary" id="generate-demo-btn">Generate Demo Earnings</button>
      <button class="btn-secondary" id="request-payout-btn">Request Payout</button>
    </div>
    <div class="earnings-section">
      <h2>Earnings History</h2>
      <div id="earnings-list" class="earnings-list">
        <div class="empty-state">
          <p>No earnings yet. Click "Generate Demo Earnings" to see demo data.</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
