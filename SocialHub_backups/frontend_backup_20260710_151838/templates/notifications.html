<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-heart"></i> SocialHub</a>
        <div class="nav-search"><i class="fas fa-search"></i><input type="text" id="global-search" placeholder="Search creators, posts, #tags..." onkeypress="if(event.key==='Enter')window.location.href='/search?q='+this.value"></div>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container">
        <div class="page-header">
            <h2><i class="fas fa-bell" style="color:var(--primary);margin-right:10px"></i>Notifications</h2>
            <button class="mark-all-read" onclick="markAllRead()"><i class="fas fa-check-double"></i> Mark all as read</button>
        </div>
        <div class="notifications-card" id="notifications-container"><div class="loading"><div class="spinner"></div></div></div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
