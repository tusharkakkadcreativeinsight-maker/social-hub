<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e1306c">
    <title>Scheduled Posts - SocialHub</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar"><a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a><div class="nav-links" id="nav-links"></div></nav>
    <div class="container fade-in">
        <form class="card slide-up" data-advanced-form="schedule">
            <h2><i class="fas fa-calendar-plus"></i> Schedule Content</h2>
            <div class="form-group"><select name="content_type"><option value="post">Post</option><option value="reel">Reel</option><option value="story">Story</option></select></div>
            <div class="form-group"><textarea name="content" id="caption-description" placeholder="Write caption..." rows="4"></textarea></div>
            <div class="form-group"><input name="hashtags" placeholder="Hashtags comma separated"></div>
            <div class="form-group"><input name="scheduled_at" type="datetime-local" required></div>
            <button type="button" class="btn btn-outline" onclick="generateCaptionForForm()"><i class="fas fa-wand-magic-sparkles"></i> Generate Caption</button>
            <button type="submit" class="btn btn-primary"><i class="fas fa-clock"></i> Schedule</button>
        </form>
        <h2 style="margin:22px 0 12px">My Scheduled Posts</h2>
        <div id="scheduled-list" class="advanced-grid"></div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
