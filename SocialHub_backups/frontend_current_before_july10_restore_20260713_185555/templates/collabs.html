<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e1306c">
    <title>Collaboration Board - SocialHub</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar"><a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a><div class="nav-links" id="nav-links"></div></nav>
    <div class="container container-wide fade-in">
        <form class="card slide-up" data-advanced-form="collab">
            <h2><i class="fas fa-handshake"></i> Post Collaboration Offer</h2>
            <div class="advanced-grid">
                <input name="title" placeholder="Offer title" required>
                <input name="budget" placeholder="Budget">
                <input name="category" placeholder="Category">
            </div>
            <textarea name="description" placeholder="Describe the collaboration" rows="4" required style="margin-top:12px"></textarea>
            <button type="submit" class="btn btn-primary"><i class="fas fa-bullhorn"></i> Publish Offer</button>
        </form>
        <h2 style="margin:22px 0 12px">Open Collaborations</h2>
        <div id="collabs-list" class="advanced-grid"></div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
