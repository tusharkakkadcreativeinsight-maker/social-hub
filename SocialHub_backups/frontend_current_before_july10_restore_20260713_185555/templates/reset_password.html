<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body class="auth-page">
    <div class="auth-bg-icons">
        <i class="fas fa-lock"></i>
        <i class="fas fa-key"></i>
        <i class="fas fa-shield-alt"></i>
    </div>
    <div class="auth-container">
        <div class="auth-card slide-up">
            <div class="auth-header">
                <h1><i class="fas fa-camera-retro"></i> Social<span>Hub</span></h1>
                <h2>Reset password</h2>
                <p>Create a new password for your account</p>
            </div>
            <form id="reset-form" onsubmit="resetPassword(event)">
                <input type="hidden" id="token" value="{{ token }}">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter new password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
                <div class="auth-divider"></div>
                <div class="auth-footer">
                    <p><a href="/login"><i class="fas fa-arrow-left"></i> Back to Sign In</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
