<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-camera"></i> Social<span>Hub</span></h1>
            <h2>Forgot password?</h2>
                <p>No worries, we'll send you reset instructions</p>
            </div>
            <div class="error hidden" id="error"></div>
            <div class="success-msg hidden" id="success"></div>
            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="padding:10px;font-size:14px">Send Reset Link</button>
            </form>
            <div class="auth-divider"><span>OR</span></div>
            <div class="auth-footer">
                <p><a href="/login">Back to Sign In</a></p>
            </div>
        </div>
        <div class="auth-card" style="margin-top:10px;text-align:center;padding:20px 40px">
            <p style="font-size:14px;color:var(--text-secondary)">Don't have an account? <a href="/register">Sign up</a></p>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
