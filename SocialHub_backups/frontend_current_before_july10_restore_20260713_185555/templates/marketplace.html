<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e1306c">
    <title>Marketplace - SocialHub</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar"><a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a><div class="nav-links" id="nav-links"></div></nav>
    <div class="container container-wide fade-in">
        <form class="card slide-up" data-advanced-form="marketplace" enctype="multipart/form-data">
            <h2><i class="fas fa-store"></i> Add Product</h2>
            <div class="advanced-grid">
                <input name="title" placeholder="Product title" required>
                <input name="price" type="number" step="0.01" placeholder="Price" required>
                <input name="category" id="product-category" placeholder="Category">
                <input name="image" type="file" accept="image/*">
            </div>
            <textarea name="description" placeholder="Description" rows="3" style="margin-top:12px"></textarea>
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Product</button>
        </form>
        <h2 style="margin:22px 0 12px">Marketplace</h2>
        <div id="marketplace-list" class="advanced-grid"></div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
