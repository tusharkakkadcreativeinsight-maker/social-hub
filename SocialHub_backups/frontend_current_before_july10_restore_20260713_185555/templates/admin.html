<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SocialHub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e1306c">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo"><i class="fas fa-camera-retro"></i> Social<span>Hub</span></a>
        <div class="nav-links" id="nav-links"></div>
    </nav>
    <div class="container container-wide fade-in">
        <div class="admin-layout slide-up">
            <div class="admin-sidebar">
                <a href="#dashboard" class="active" data-admin-tab="dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a href="#users" data-admin-tab="users"><i class="fas fa-users"></i> Users</a>
                <a href="#posts" data-admin-tab="posts"><i class="fas fa-newspaper"></i> Posts</a>
                <a href="#reports" data-admin-tab="reports"><i class="fas fa-flag"></i> Reports</a>
                <a href="#backup" onclick="adminBackup();return false;"><i class="fas fa-database"></i> Backup</a>
                <a href="/marketplace"><i class="fas fa-store"></i> Marketplace</a>
                <a href="/collabs"><i class="fas fa-handshake"></i> Collabs</a>
                <a href="#settings" data-admin-tab="settings"><i class="fas fa-cog"></i> Settings</a>
            </div>
            <div class="admin-content">
                <h2 style="font-size:24px;font-weight:800;margin-bottom:24px">Admin Dashboard</h2>
                <div id="admin-dashboard">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/animations.js"></script>
</body>
</html>
