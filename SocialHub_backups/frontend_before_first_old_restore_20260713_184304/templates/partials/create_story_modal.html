<div class="modal-overlay" id="create-story-modal" data-modal aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="create-story-title"><button class="modal-close" data-action="close-modal" data-target="create-story-modal" aria-label="Close">×</button><h2 id="create-story-title">Create story</h2><form id="story-upload-form" data-action="story-upload-form"><label class="upload-dropzone" for="story-file"><i class="fas fa-circle-plus"></i><strong>Select story media</strong><input id="story-file" name="file" type="file" accept="image/*,video/*" hidden required></label><label for="story-caption">Caption</label><textarea id="story-caption" name="caption" class="form-control" rows="3" placeholder="Add a caption..."></textarea><div id="story-preview" class="upload-preview"></div><div class="modal-actions"><button class="btn btn-primary">Share story</button></div></form></section></div>
