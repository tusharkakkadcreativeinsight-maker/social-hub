{% extends 'base.html' %}
{% block title %}Notifications - SocialHub{% endblock %}
{% block page_name %}notifications{% endblock %}
{% block content %}
<header class="card-title-row"><div><h1 class="page-title">Notifications</h1><p class="page-subtitle">Follows, likes, comments, mentions, messages and system updates.</p></div><button class="btn btn-secondary" data-action="mark-all-notifications-read">Mark all read</button></header><div class="tabs" id="notification-tabs"><button class="tab active" data-notification-filter="all">All</button><button class="tab" data-notification-filter="follow">Follows</button><button class="tab" data-notification-filter="like">Likes</button><button class="tab" data-notification-filter="comment">Comments</button><button class="tab" data-notification-filter="mention">Mentions</button><button class="tab" data-notification-filter="system">System</button></div><section id="notifications-container" class="section-card"><div class="skeleton-list"></div></section>
{% endblock %}
