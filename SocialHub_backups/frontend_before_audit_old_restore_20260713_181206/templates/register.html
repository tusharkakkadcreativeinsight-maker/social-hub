{% extends 'auth_base.html' %}
{% block title %}Register - SocialHub{% endblock %}
{% block page_name %}register{% endblock %}
{% block content %}<form class='auth-card' id='register-form' data-action='register-form'><a class='brand' href='/'><span class='brand-mark'><i class='fas fa-bolt'></i></span><span>SocialHub</span></a><h1>Create account</h1><p class='muted'>Secure, accessible authentication for SocialHub.</p><label>Full name<input class='form-control' name='full_name' autocomplete='name'></label><label>Username<input class='form-control' name='username' autocomplete='username' required></label><label>Email<input class='form-control' name='email' type='email' autocomplete='email' required></label><label>Password<div class='password-wrap'><input class='form-control' name='password' type='password' autocomplete='new-password' minlength='6' required><button class='btn btn-sm btn-secondary' type='button' data-action='toggle-password'>Show</button></div></label><button class='btn btn-primary' type='submit'>Create account</button><a class='muted' href='/login'>Sign in</a></form>{% endblock %}
