{% extends 'auth_base.html' %}
{% block title %}Reset Password - SocialHub{% endblock %}
{% block page_name %}reset-password{% endblock %}
{% block content %}<form class='auth-card' id='reset-form' data-action='reset-form'><a class='brand' href='/'><span class='brand-mark'><i class='fas fa-bolt'></i></span><span>SocialHub</span></a><h1>Choose new password</h1><p class='muted'>Secure, accessible authentication for SocialHub.</p><input type='hidden' name='token' value='{{ token }}'><label>New password<div class='password-wrap'><input class='form-control' name='password' type='password' autocomplete='new-password' required><button class='btn btn-sm btn-secondary' type='button' data-action='toggle-password'>Show</button></div></label><button class='btn btn-primary' type='submit'>Choose new password</button><a class='muted' href='/login'>Back to login</a></form>{% endblock %}
