{% extends 'base.html' %}
{% block title %}Profile - SocialHub{% endblock %}
{% block page_name %}profile{% endblock %}
{% block content %}
<section class="section-card" id="profile-root" data-username="{{ username or 'me' }}"><img id="profile-cover" class="profile-cover" src="/static/images/default-cover.png" alt="Profile cover"><div class="profile-head"><img id="profile-avatar" class="profile-photo" src="/static/images/default-avatar.png" alt="Profile photo"><div><h1 id="profile-name">Loading profile...</h1><p id="profile-handle" class="muted"></p><p id="profile-bio">Loading creator information.</p><div class="profile-stats"><b id="profile-post-count">-- Posts</b><b id="profile-followers">-- Followers</b><b id="profile-following">-- Following</b></div><div class="hero-actions"><button id="profile-follow-btn" class="btn btn-primary" data-action="follow-profile">Follow</button><a class="btn btn-secondary" href="/chat">Message</a><button class="btn btn-outline" data-action="open-modal" data-target="share-modal">Share</button></div></div></div></section><section class="section-card"><h2>Highlights</h2><div id="profile-highlights" class="stories-row"></div></section><div class="tabs"><button class="tab active" data-profile-tab="posts">Posts</button><button class="tab" data-profile-tab="reels">Reels</button><button class="tab" data-profile-tab="tagged">Tagged</button><button class="tab" data-profile-tab="saved">Saved</button></div><section id="profile-grid" class="profile-grid"><div class="skeleton-list"></div></section>
{% endblock %}
