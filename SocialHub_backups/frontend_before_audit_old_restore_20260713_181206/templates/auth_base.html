<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}SocialHub Auth{% endblock %}</title>
  <script>(function(){try{var p=localStorage.getItem('socialhub-theme')||'system';var m=matchMedia('(prefers-color-scheme: dark)');document.documentElement.dataset.theme=p==='system'?(m.matches?'dark':'light'):p}catch(e){document.documentElement.dataset.theme='dark'}})();</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/animations.css"><link rel="stylesheet" href="/static/css/professional.css">
</head>
<body data-page="{% block page_name %}auth{% endblock %}" class="auth-body">
<main class="auth-shell page-enter"><section class="auth-art"><a class="brand" href="/"><span class="brand-mark"><i class="fas fa-bolt"></i></span><span>SocialHub</span></a><h1>Connect, create, and grow.</h1><p>Secure access to your SocialHub community, creator tools, analytics, live rooms, and wallet.</p></section><section class="auth-panel">{% block content %}{% endblock %}</section></main>
{% include 'partials/toast_container.html' %}<script type="module" src="/static/js/app.js"></script>
</body></html>
